<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Mis hábitos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: una columna tipo app (máx. 760px), pestañas fijas arriba, tarjetas por categoría con su propio color de señal */
/* Paleta "Anillos": un solo look oscuro estilo iOS (negro puro, tarjetas agrupadas, controles segmentados) */
:root{
 color-scheme:dark;
 --bg:#000000;--card:#121212;--soft:#242424;--line:#2c2c2e;--ink:#ffffff;--mu:#8e8e93;
 --ej:#fa114f;--es:#92e82a;--ju:#1eeaef;--ac:#92e82a;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;
 --fd:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;--fb:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:760px;margin:0 auto;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(34px,8vw,48px);letter-spacing:-.02em;line-height:1;margin:0;text-wrap:balance}
h2{font-family:var(--fd);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.date{color:var(--mu);font-size:14px;margin-top:6px;text-transform:capitalize}
.wk{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 0 10px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 4px;border-radius:999px;font:600 14px var(--fb);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{font-family:var(--fb);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--es);outline-offset:2px}
.view{display:grid;gap:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;border-top:4px solid var(--c)}
.cat .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat .nm{font-family:var(--fd);font-weight:700;font-size:19px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mu);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.big{font-size:34px;font-weight:800;line-height:1}
.big small{font-size:15px;font-weight:500;color:var(--mu);font-family:var(--fb)}
.bar{height:9px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .5s}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:8px 4px;font-weight:600;font-size:13px}
.quick button:hover{border-color:var(--c);color:var(--c)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;display:grid;gap:5px}
.day.today{border-color:var(--ink)}
.day .dl{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase}
.day .dn{font-family:var(--fd);font-weight:700;font-size:17px}
.dots{display:flex;gap:3px;justify-content:center;min-height:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.list{display:grid;gap:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.row .tx{flex:1;min-width:0}
.row .t1{font-weight:600;overflow-wrap:anywhere}
.row .t2{font-size:13px;color:var(--mu);overflow-wrap:anywhere}
.row .mn{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 6px;line-height:1}
.x.sure{color:var(--bad);font-size:13px;font-weight:700}
.empty{color:var(--mu);font-size:14px;padding:6px 0}
.lab{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.fld{display:grid;gap:6px}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:11px 4px;font-weight:600}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:11px;padding:13px;font-weight:700;font-size:15px}
.go:disabled{opacity:.5}
.timer{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.timer .num{font-size:28px;font-weight:700}
.timer button{border:0;border-radius:9px;padding:9px 14px;font-weight:700;background:var(--c);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.scroll{overflow-x:auto}
svg{display:block}
svg text{font-family:var(--fb);fill:var(--mu);font-size:10px}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mu);flex-wrap:wrap}
.legend b{display:inline-block;width:11px;height:11px;border-radius:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:24px;font-weight:800;font-family:var(--fd);font-variant-numeric:tabular-nums;color:var(--c)}
.stat .k{font-size:12px;color:var(--mu)}
.cfg{border-top:4px solid var(--c)}
.note{color:var(--mu);font-size:12px;text-align:center}
/* Estilo iOS / Mac */
h1{font-weight:700;letter-spacing:-.025em}
.tabs{background:var(--card);border-radius:11px;padding:3px;gap:2px;margin-bottom:12px;top:calc(env(safe-area-inset-top,0px) + 6px)}
.tabs button{border:0;background:transparent;color:var(--mu);border-radius:8px;padding:8px 4px;font-weight:600;font-size:13px}
.tabs button.on{background:var(--soft);color:var(--ink);border:0}
.cat{border:0;border-radius:16px;padding:16px}
.cat{border-top:0}
.cat .nm{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600}
.cat .nm::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.big{font-weight:700;letter-spacing:-.02em}
.bar{border:0;background:var(--soft);height:8px}
.quick button{border:0;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);padding:8px 4px}
.quick button:hover{background:color-mix(in srgb,var(--c) 28%,transparent);color:var(--c)}
.quick button[data-d]{background:var(--soft);color:var(--ink)}
.pill{background:var(--soft)}
.panel{border:0;border-radius:16px}
.day{border:0;background:var(--soft);border-radius:12px}
.day.today{box-shadow:0 0 0 2px var(--ac);border:0}
.row{border-top:.5px solid var(--line)}
input,select{border:0;background:var(--soft);border-radius:10px}
.seg{background:var(--soft);padding:3px;border-radius:11px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mu);border-radius:8px;padding:9px 4px}
.seg button.on{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:0}
.chip{border:0;background:var(--soft)}
.chip.on{background:var(--ink);color:#000}
.go{background:var(--ac);color:#000;border-radius:999px;font-weight:600}
.timer{border:0;background:var(--soft);border-radius:14px}
.timer button{border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.stat{border:0;background:var(--card);border-radius:14px}
.toast{background:#2c2c2e;color:#fff;box-shadow:0 0 0 .5px #3a3a3c}
.lab{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
.wk{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.tabs{grid-template-columns:repeat(5,1fr)}
.tabs button{font-size:12.5px;padding:8px 2px}
.trow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:.5px solid var(--line)}
.tlist>.trow:first-child{border-top:0}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:transparent;flex:none;padding:0;display:flex;align-items:center;justify-content:center;color:#000;font-size:14px;font-weight:800}
.trow.done .ck{background:var(--c)}
.trow.done .ck::after{content:"✓"}
.trow.done .t1{text-decoration:line-through;color:var(--mu)}
.trow .tx{flex:1;min-width:0}
.ib{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 0 12px 34px}
.sheet a,.sheet button{display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:10px 4px;font-size:13px;font-weight:600;background:var(--soft);color:var(--ink)}
.sheet small{display:block;font-size:11px;color:var(--mu);font-weight:500;margin-top:2px}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dnav button{border:0;background:var(--soft);color:var(--ink);border-radius:999px;width:36px;height:36px;font-size:18px}
.dnav .dt{font-weight:600;text-align:center}
.date{text-transform:none!important}.date::first-letter{text-transform:uppercase}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:420px){.three{grid-template-columns:1fr 1fr}.three .fld:last-child{grid-column:1/-1}.sheet{padding-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main>
 <div class="top">
  <div><h1>Mis hábitos</h1><div class="date" id="today"></div></div>
  <div class="wk" id="wkl"></div>
 </div>
 <nav class="tabs" id="tabs">
  <button data-v="hoy" class="on">Hoy</button><button data-v="tar">Tareas</button><button data-v="reg">Registrar</button><button data-v="pro">Progreso</button><button data-v="aju">Metas</button>
 </nav>

 <section class="view" id="v-hoy">
  <div class="cats" id="cats"></div>
  <div class="panel">
   <div class="ph"><h2>Tareas de hoy</h2><button class="ib" type="button" data-go="tar">+ Agregar</button></div>
   <div class="tlist" id="hoyTasks"></div>
  </div>
  <div class="panel">
   <div class="ph"><h2>Esta semana</h2><span class="wk">lun – dom</span></div>
   <div class="strip" id="strip"></div>
  </div>
  <div class="panel">
   <div class="ph"><h2>Hoy</h2><span class="wk num" id="todayTot"></span></div>
   <div class="list" id="todayList"></div>
  </div>
 </section>

 <section class="view" id="v-tar" hidden>
  <div class="panel">
   <div class="dnav"><button type="button" data-tn="-1" aria-label="Día anterior">‹</button><div class="dt" id="tdl"></div><button type="button" data-tn="1" aria-label="Día siguiente">›</button></div>
  </div>
  <form class="panel" id="tform">
   <div class="fld"><label class="lab" for="ttxt">¿Qué tienes que hacer?</label><input id="ttxt" type="text" placeholder="Ej.: Repasar ISO 14224, ir al gimnasio, pagar luz…" required></div>
   <div class="three">
    <div class="fld"><label class="lab" for="thora">Hora (opcional)</label><input id="thora" type="time"></div>
    <div class="fld"><label class="lab" for="tdur">Duración</label><select id="tdur"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">1 h</option><option value="90">1 h 30</option><option value="120">2 h</option><option value="180">3 h</option></select></div>
    <div class="fld"><label class="lab" for="tcat">Hábito</label><select id="tcat"><option value="">Ninguno</option><option value="ej">Ejercicio</option><option value="es">Estudio</option><option value="ju">Juegos</option></select></div>
   </div>
   <div class="fld"><label class="lab" for="tnota">Nota (opcional)</label><input id="tnota" type="text" placeholder="Lugar, detalle o enlace"></div>
   <button class="go" id="tsave" type="submit">Agregar tarea</button>
   <div class="t2" style="color:var(--mu);font-size:12px">Si eliges un hábito, al marcar la tarea como hecha se suma a tus minutos de ese hábito.</div>
  </form>
  <div class="panel">
   <div class="ph"><h2>Pendientes</h2><span class="wk" id="tcount"></span></div>
   <div class="tlist" id="tasks"></div>
  </div>
 </section>

 <section class="view" id="v-reg" hidden>
  <form class="panel" id="form">
   <div class="fld"><span class="lab">¿Qué hiciste?</span><div class="seg" id="segCat"></div></div>
   <div class="fld"><label class="lab" for="act">Actividad</label><select id="act"></select>
    <input id="actOther" type="text" placeholder="Escribe la actividad" hidden></div>
   <div class="timer" id="timerBox"><div><div class="lab">Cronómetro</div><div class="num" id="tclock">00:00</div></div><button type="button" id="tbtn">Iniciar</button></div>
   <div class="fld"><span class="lab">Minutos</span><div class="chips" id="minChips"></div><input id="min" type="number" min="1" max="600" inputmode="numeric" placeholder="Minutos" required></div>
   <div class="two">
    <div class="fld"><label class="lab" for="fecha">Fecha</label><input id="fecha" type="date" required></div>
    <div class="fld"><label class="lab" for="sens">¿Cómo te fue?</label><select id="sens"><option value="">—</option><option value="3">Muy bien</option><option value="2">Normal</option><option value="1">Me costó</option></select></div>
   </div>
   <div class="fld"><label class="lab" for="nota">Nota (opcional)</label><input id="nota" type="text" placeholder="Ej.: 5 km, capítulo 3, ganó la partida…"></div>
   <button class="go" id="save" type="submit">Guardar registro</button>
  </form>
 </section>

 <section class="view" id="v-pro" hidden>
  <div class="chips" id="pf"></div>
  <div class="panel">
   <div class="ph"><h2>Constancia</h2><span class="wk">últimas 17 semanas</span></div>
   <div class="scroll"><div id="heat"></div></div>
   <div class="legend">Menos <b style="background:var(--soft);border:1px solid var(--line)"></b><b class="lv" data-o=".3"></b><b class="lv" data-o=".55"></b><b class="lv" data-o=".8"></b><b class="lv" data-o="1"></b> Más</div>
  </div>
  <div class="panel">
   <div class="ph"><h2>Minutos por semana</h2><span class="wk" id="chartNote"></span></div>
   <div class="scroll"><div id="chart"></div></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="panel">
   <div class="ph"><h2>Historial</h2><span class="wk" id="histN"></span></div>
   <div class="list" id="hist"></div>
  </div>
 </section>

 <section class="view" id="v-aju" hidden>
  <div id="cfgBox" class="view"></div>
  <button class="go" id="saveCfg" type="button">Guardar metas</button>
 </section>

 <p class="note" id="mode">Conectando…</p>
</main>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
var CATS=[{k:'ej',n:'Ejercicio',i:'🏃'},{k:'es',n:'Estudio',i:'📚'},{k:'ju',n:'Juegos',i:'🎮'}];
var DEF={
 ej:{modo:'meta',min:150,dias:4,acts:['Gimnasio','Correr','Caminar','Fútbol','Bicicleta']},
 es:{modo:'meta',min:300,dias:5,acts:['Curso TECSUP','Inglés','Lectura','Programación']},
 ju:{modo:'limite',min:420,dias:7,acts:['PC','Consola','Celular','Juegos de mesa']}
};
var S=[],cfg=JSON.parse(JSON.stringify(DEF)),db=null,view='hoy',cat='ej',pf='all';
var $=function(i){return document.getElementById(i)};
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function P(s){return new Date(s+'T12:00:00')}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function wStart(d){var x=new Date(d);x.setHours(12,0,0,0);return add(x,-((x.getDay()+6)%7))}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML.replace(/"/g,'&quot;')}
function C(k){return CATS.filter(function(c){return c.k===k})[0]||CATS[0]}
function hm(m){m=Math.round(m||0);if(m<60)return m+' min';var h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'')}
function sh(d,o){try{return d.toLocaleDateString('es-PE',o)}catch(e){return ymd(d)}}
var TODAY=ymd(new Date());
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2200)}

function sumRange(k,a,b){return S.reduce(function(s,x){return (!k||x.cat===k)&&x.date>=a&&x.date<=b?s+(+x.min||0):s},0)}
function daysRange(k,a,b){var o={};S.forEach(function(x){if(x.cat===k&&x.date>=a&&x.date<=b)o[x.date]=1});return Object.keys(o).length}
function streak(k){var set={};S.forEach(function(x){if(x.cat===k)set[x.date]=1});var d=new Date();if(!set[ymd(d)])d=add(d,-1);var n=0;while(set[ymd(d)]){n++;d=add(d,-1)}return n}
function best(k){var ds=Object.keys(S.reduce(function(o,x){if(x.cat===k)o[x.date]=1;return o},{})).sort();var b=0,c=0,prev=null;ds.forEach(function(d){c=prev&&ymd(add(P(prev),1))===d?c+1:1;b=Math.max(b,c);prev=d});return b}

function renderHoy(){
 var ws=wStart(new Date()),a=ymd(ws),b=ymd(add(ws,6));
 $('wkl').textContent='Semana del '+sh(ws,{day:'numeric',month:'short'});
 $('cats').innerHTML=CATS.map(function(c){
  var g=cfg[c.k],m=sumRange(c.k,a,b),dd=daysRange(c.k,a,b),pct=g.min?Math.min(100,m/g.min*100):0,st=streak(c.k),pill;
  if(g.modo==='limite'){var r=g.min?m/g.min:0;pill=r>1?'<span class="pill bad">Pasaste el límite</span>':r>=.8?'<span class="pill warn">Cerca del límite</span>':'<span class="pill ok">Dentro del límite</span>'}
  else pill=m>=g.min&&dd>=g.dias?'<span class="pill ok">Meta cumplida</span>':st?'<span class="pill">🔥 '+st+(st===1?' día':' días')+'</span>':'<span class="pill">Sin racha</span>';
  var lbl=g.modo==='limite'?'límite '+g.min:'meta '+g.min;

  try{db=await HAB_API.connect()}catch(e){$('mode').textContent='No se pudo conectar con tu hoja de Google: '+((e&&e.message)||e);return}
  $('mode').textContent='Tus registros se guardan en tu hoja de Google.';
 }else{
  try{if(window.claude&&claude.use){claude.use('downloads').then(function(x){dl=x}).catch(function(){});db=await claude.use('db')}}catch(e){db=null}
  if(!db){$('mode').textContent='Vista previa: los registros de esta sesión no se guardan.';return}
  $('mode').textContent='Tus registros se guardan en la nube y los ves desde cualquier dispositivo.';
 }
 db.collection('sesiones').onSnapshot(function(s){S=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});render()},function(){$('mode').textContent='No se pudieron cargar los registros. Recarga la página.'});
 db.collection('tareas').onSnapshot(function(s){T=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});render()},function(){});
 db.doc('config/ajustes').onSnapshot(function(d){if(d.exists){var v=d.data();CATS.forEach(function(c){if(v[c.k])cfg[c.k]=Object.assign({},DEF[c.k],v[c.k])})}render();if(view==='aju')renderAju()},function(){});
})();
</script>
